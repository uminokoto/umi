<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>海チェック</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E6F0EE; --panel:#F6FAF9; --ink:#12343B; --sub:#4E6B70; --line:#C9DAD8;
  --sea:#1F6F8B; --sea-soft:#CFE4EA; --land:#D9CDB4; --buoy:#E8A200;
  --off:#1B8A5A; --cross:#C98A00; --on:#C2462E; --none:#6C8589;
  --num:"Barlow Condensed","Arial Narrow",sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C2328; --panel:#123138; --ink:#E4F0EE; --sub:#93AFB2; --line:#24474E;
    --sea:#5BB3CF; --sea-soft:#1A4450; --land:#4A4433; --buoy:#F2B705;
    --off:#46C08A; --cross:#E0AA2E; --on:#E8735C; --none:#7E989C;
  }
}
:root[data-theme="dark"]{
  --bg:#0C2328; --panel:#123138; --ink:#E4F0EE; --sub:#93AFB2; --line:#24474E;
  --sea:#5BB3CF; --sea-soft:#1A4450; --land:#4A4433; --buoy:#F2B705;
  --off:#46C08A; --cross:#E0AA2E; --on:#E8735C; --none:#7E989C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* map */
.mapwrap{position:relative;height:46vh;min-height:280px;max-height:560px;border-bottom:1px solid var(--line)}
#map{position:absolute;inset:0;background:var(--sea-soft)}
.mapbar{position:absolute;top:10px;left:10px;right:10px;z-index:500;display:flex;gap:6px;max-width:520px}
.mapbar input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.mapbar button{flex:none;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.results{position:absolute;top:52px;left:10px;z-index:600;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:min(520px,calc(100% - 20px));width:100%;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.results button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:9px 12px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:none}
.results small{color:var(--sub);margin-left:6px}
.maphint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:500;background:var(--panel);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--sub);white-space:nowrap;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.leaflet-container{font-family:var(--jp)}
.pin{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);white-space:nowrap}
.pin b{background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:2px 7px;border-radius:7px;line-height:1.4}
.pin b em{font-style:normal;font-family:var(--num);font-size:14px;margin-left:4px}
.pin i{width:2px;height:8px;background:var(--ink)}
.pin.off b{background:var(--off)}.pin.on b{background:var(--on)}.pin.cross b{background:var(--cross)}
.pin.off i{background:var(--off)}.pin.on i{background:var(--on)}.pin.cross i{background:var(--cross)}
.pin.temp b{background:var(--buoy);color:#1b1b1b}.pin.temp i{background:var(--buoy)}
.leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.5}
.pop b{font-family:var(--num);font-size:18px}
.pop button{margin-top:6px;border:none;background:var(--sea);color:#fff;border-radius:6px;padding:4px 10px;font-weight:700}

/* spot bar */
.spots{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;align-items:center;scrollbar-width:none}
.spots::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.ghost{color:var(--sub)}
.chip.temp[aria-pressed="true"]{background:var(--buoy);border-color:var(--buoy);color:#1b1b1b}

/* hero */
.place{margin-top:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.place h1{font-size:22px;margin:0;font-weight:700}
.place span{font-size:12px;color:var(--sub)}
.place .btn{margin-left:auto}
.hero{margin-top:6px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.dial{width:100%;max-width:280px;justify-self:center}
.read{display:flex;flex-direction:column;gap:10px}
.verdict{font-weight:700;font-size:20px;line-height:1.3}
.verdict small{display:block;font-weight:400;font-size:13px;color:var(--sub)}
.stat{display:flex;align-items:baseline;gap:6px}
.stat b{font-family:var(--num);font-weight:600;font-size:44px;line-height:1}
.stat span{color:var(--sub);font-size:13px}
.stat em{font-style:normal;font-family:var(--num);font-size:20px;font-weight:500}
.wx{font-size:14px;color:var(--sub)}
.wx strong{color:var(--ink);font-weight:500}
.facepick{font-size:13px;color:var(--sub)}
.facepick div{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.facepick button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 0;font-size:13px}
@media (max-width:460px){.hero{grid-template-columns:1fr}.dial{max-width:230px}.stat b{font-size:40px}}

section{margin-top:22px}
h2{font-size:15px;font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 span{font-weight:400;font-size:12px;color:var(--sub);text-align:right}

.links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.links a{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;font-weight:500;font-size:14px}
.links a i{display:block;font-style:normal;font-size:20px;line-height:1.2}
.links a.custom{border-color:var(--sea)}
@media (max-width:380px){.links{grid-template-columns:repeat(2,minmax(0,1fr))}}

.days{display:flex;gap:4px;margin-bottom:8px}
.days button{border:none;background:transparent;padding:4px 10px;border-radius:6px;color:var(--sub);font-weight:500}
.days button[aria-pressed="true"]{background:var(--sea-soft);color:var(--ink)}
.tidebox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 10px 6px}
.tidebox svg{display:block;width:100%;height:auto}
.tides{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:4px;color:var(--sub)}
.tides b{font-family:var(--num);font-size:17px;color:var(--ink);font-weight:600}
.scroller{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{position:sticky;left:0;background:var(--panel);text-align:left;font-weight:500;color:var(--sub);z-index:1}
tr:last-child td,tr:last-child th{border-bottom:none}
td.now{background:var(--sea-soft)}
td .n{font-family:var(--num);font-size:16px;font-weight:600}
.k{display:inline-block;font-size:11px;font-weight:700;padding:0 5px;border-radius:4px;color:#fff}
.k.off{background:var(--off)}.k.cross{background:var(--cross)}.k.on{background:var(--on)}.k.none{background:var(--none)}
.arrow{display:inline-block;width:16px;height:16px;vertical-align:-3px}
.note{font-size:12px;color:var(--sub);margin-top:8px}
.msg{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:14px;font-size:14px;grid-column:1/-1}
.msg b{display:block;margin-bottom:4px}

dialog{border:none;border-radius:16px;padding:0;max-width:min(520px,94vw);width:100%;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.ed{padding:18px}
.ed h3{margin:0 0 12px;font-size:17px}
.ed label{display:block;font-size:13px;color:var(--sub);margin-top:10px}
.ed input,.ed select{width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ed .hint{font-size:12px;color:var(--sub);margin-top:4px}
.ed details{margin-top:12px}
.ed summary{cursor:pointer;font-weight:500}
.btns{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.btn.danger{color:var(--on);border-color:transparent}
</style>
</head>
<body>
<div class="mapwrap" id="mapwrap">
  <div id="map" aria-label="地図"></div>
  <form class="mapbar" id="searchForm">
    <input id="q" type="search" placeholder="地名で探す（例：古仁屋、バリ、ワイキキ）" autocomplete="off">
    <button type="button" id="locBtn" title="現在地へ" aria-label="現在地へ">📍</button>
  </form>
  <div class="results" id="results" hidden></div>
  <div class="maphint">海の上をタップするとその場所の予報が出ます</div>
</div>

<div class="wrap">
  <nav class="spots" id="spots" aria-label="保存したスポット"></nav>
  <div class="place" id="place"></div>
  <div class="hero" id="hero"></div>

  <section>
    <h2>他のサイトで見る <span id="linkhint"></span></h2>
    <div class="links" id="links"></div>
  </section>

  <section id="dataSec">
    <div class="days" id="days"></div>
    <h2>潮位 <span>モデル予測・目安</span></h2>
    <div class="tidebox" id="tide"></div>
    <h2 style="margin-top:18px">時間ごと <span>現地時間・風はm/s・波はm</span></h2>
    <div class="scroller" id="hourly"></div>
    <p class="note">データ：Open-Meteo（波・風・天気・潮位の予測モデル）。地図：© OpenStreetMap, © CARTO。潮位は沿岸の地形を細かく反映しないため、正確な時刻は潮見表で確認してください。</p>
  </section>
</div>

<dialog id="dlg"><form class="ed" id="edform" method="dialog"></form></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
const DIRS=[["北",0],["北東",45],["東",90],["南東",135],["南",180],["南西",225],["西",270],["北西",315]];
const DEFAULT=[{id:"s1",name:"鵠沼",lat:35.3175,lon:139.4710,face:180,tide:"",cam:"",wn:"",yahoo:""}];
const KEY="umi-check-v1";
let state={spots:DEFAULT,cur:"s1"};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.spots))state=s;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({spots:state.spots,cur:state.cur==="temp"?(state.spots[0]?.id||null):state.cur}))}catch(e){}};
let temp=null, dayIdx=0, cache={}, nowCache={};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const spot=()=>state.cur==="temp"&&temp?temp:(state.spots.find(s=>s.id===state.cur)||state.spots[0]||temp);
const dirName=d=>d==null?"—":["北","北北東","北東","東北東","東","東南東","南東","南南東","南","南南西","南西","西南西","西","西北西","北西","北北西"][Math.round(((d%360)+360)%360/22.5)%16];
function windKind(from,face){
  if(face==null||from==null) return ["none","未判定"];
  const diff=Math.abs(((from-face)%360+540)%360-180);
  if(diff<=50) return ["on","オンショア"];
  if(diff>=130) return ["off","オフショア"];
  return ["cross","サイド"];
}
const WX={0:["☀️","快晴"],1:["🌤","晴れ"],2:["⛅","晴れ時々曇り"],3:["☁️","曇り"],45:["🌫","霧"],48:["🌫","霧"],51:["🌦","霧雨"],53:["🌦","霧雨"],55:["🌦","霧雨"],61:["🌧","小雨"],63:["🌧","雨"],65:["🌧","強い雨"],66:["🌧","着氷性の雨"],67:["🌧","着氷性の雨"],71:["🌨","小雪"],73:["🌨","雪"],75:["🌨","大雪"],77:["🌨","雪"],80:["🌦","にわか雨"],81:["🌧","にわか雨"],82:["⛈","激しいにわか雨"],85:["🌨","にわか雪"],86:["🌨","にわか雪"],95:["⛈","雷雨"],96:["⛈","雷雨"],99:["⛈","雷雨"]};
const wx=c=>WX[c]||["・","—"];
const f1=v=>v==null?"–":v.toFixed(1), f0=v=>v==null?"–":v.toFixed(0);
const arrowSvg=(from,color)=>from==null?"–":`<svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><g transform="rotate(${from+180} 8 8)"><path d="M8 1 L12 9 L8.8 7.6 L8.8 15 L7.2 15 L7.2 7.6 L4 9 Z" fill="${color||'currentColor'}"/></g></svg>`;

/* ---------- map ---------- */
let map=null, tempMarker=null, spotLayer=null;
function initMap(){
  if(!window.L){$("mapwrap").hidden=true;return;}
  const s=spot();
  map=L.map("map",{zoomControl:false,worldCopyJump:true}).setView(s?[s.lat,s.lon]:[33,135],s?9:4);
  L.control.zoom({position:"bottomright"}).addTo(map);
  const dark=matchMedia("(prefers-color-scheme: dark)").matches;
  L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark?"dark_all":"rastertiles/voyager"}/{z}/{x}/{y}{r}.png`,{
    attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:"abcd",maxZoom:18
  }).addTo(map);
  spotLayer=L.layerGroup().addTo(map);
  map.on("click",e=>{
    const ll=e.latlng.wrap();
    temp={id:"temp",temp:true,name:"選んだ地点",lat:+ll.lat.toFixed(4),lon:+ll.lng.toFixed(4),face:null};
    state.cur="temp"; dayIdx=0; $("results").hidden=true;
    drawTemp(); renderAll();
  });
  map.getContainer().addEventListener("click",e=>{if(e.target.closest(".go")) $("place").scrollIntoView({behavior:"smooth"});});
}
const pinIcon=(cls,label)=>L.divIcon({className:"",html:`<div class="pin ${cls}"><b>${label}</b><i></i></div>`,iconSize:[0,0]});
function drawTemp(){
  if(!map) return;
  if(tempMarker){map.removeLayer(tempMarker);tempMarker=null;}
  if(temp&&state.cur==="temp") tempMarker=L.marker([temp.lat,temp.lon],{icon:pinIcon("temp","読み込み中…"),zIndexOffset:1000}).addTo(map);
}
async function drawSpots(){
  if(!map) return;
  spotLayer.clearLayers();
  for(const s of state.spots){
    const m=L.marker([s.lat,s.lon],{icon:pinIcon("",esc(s.name))}).addTo(spotLayer);
    m.on("click",ev=>{L.DomEvent.stopPropagation(ev);state.cur=s.id;dayIdx=0;save();drawTemp();renderAll();});
    loadNow(s).then(n=>{
      const [k]=windKind(n.wd,s.face);
      m.setIcon(pinIcon(k==="none"?"":k,`${esc(s.name)}<em>${n.wh!=null?n.wh.toFixed(1)+"m":""} ${n.ws!=null?n.ws.toFixed(0)+"m/s":""}</em>`));
    }).catch(()=>{});
  }
}
async function loadNow(s){
  const k=`${s.lat},${s.lon}`;
  if(nowCache[k]&&Date.now()-nowCache[k].t<15*60e3) return nowCache[k].d;
  const [w,m]=await Promise.all([
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&current=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms`).then(r=>r.json()),
    fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${s.lat}&longitude=${s.lon}&current=wave_height`).then(r=>r.json())
  ]);
  const d={ws:w.current?.wind_speed_10m,wd:w.current?.wind_direction_10m,wh:m.current?.wave_height};
  nowCache[k]={t:Date.now(),d}; return d;
}

/* search */
let sTimer;
$("q").addEventListener("input",()=>{clearTimeout(sTimer);sTimer=setTimeout(search,350);});
$("searchForm").addEventListener("submit",e=>{e.preventDefault();search();});
async function search(){
  const q=$("q").value.trim(), box=$("results");
  if(q.length<2){box.hidden=true;return;}
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=ja`).then(r=>r.json());
    const list=r.results||[];
    box.innerHTML=list.length?list.map((p,i)=>`<button type="button" data-i="${i}">${esc(p.name)}<small>${esc([p.admin1,p.country].filter(Boolean).join("、"))}</small></button>`).join("")
      :`<button type="button" disabled>見つかりません。地図を動かして探してください</button>`;
    box.hidden=false;
    box.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const p=list[+b.dataset.i];map&&map.flyTo([p.latitude,p.longitude],11);box.hidden=true;$("q").blur();});
  }catch(e){box.hidden=true;}
}
$("locBtn").onclick=()=>{
  if(!navigator.geolocation||!map) return;
  navigator.geolocation.getCurrentPosition(p=>map.flyTo([p.coords.latitude,p.coords.longitude],11),()=>alert("現在地を取得できませんでした。ブラウザの位置情報の許可を確認してください。"));
};

/* ---------- spots / place ---------- */
function renderSpots(){
  $("spots").innerHTML=(temp?`<button class="chip temp" aria-pressed="${state.cur==="temp"}" data-id="temp">📍 選んだ地点</button>`:"")
    +state.spots.map(s=>`<button class="chip" aria-pressed="${s.id===state.cur}" data-id="${esc(s.id)}">${esc(s.name)}</button>`).join("")
    +`<button class="chip ghost" id="addBtn">＋ 追加</button>`;
  $("spots").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{
    state.cur=b.dataset.id;save();dayIdx=0;drawTemp();
    const s=spot(); if(map&&s) map.flyTo([s.lat,s.lon],Math.max(map.getZoom(),9));
    renderAll();
  });
  $("addBtn").onclick=()=>openEditor(null);
}
function renderPlace(s){
  $("place").innerHTML=`<h1>${esc(s.name)}</h1><span>${s.lat}, ${s.lon}</span>`+
    (s.temp?`<button class="btn primary" id="saveTemp">この地点を保存</button>`:`<button class="btn" id="editBtn">編集</button>`);
  if(s.temp) $("saveTemp").onclick=()=>openEditor({...temp,id:"s"+Date.now(),name:"",face:temp.face??180,tide:"",cam:"",wn:"",yahoo:""},true);
  else $("editBtn").onclick=()=>openEditor(s);
}

function renderLinks(s){
  const q=encodeURIComponent(s.name);
  const L2=[["🌬","Windy",`https://www.windy.com/?waves,${s.lat},${s.lon},11`,false]];
  if(!s.temp){
    L2.push(["🌊","潮見表",s.tide||`https://www.google.com/search?q=${q}+%E6%BD%AE%E8%A6%8B%E8%A1%A8`,!!s.tide]);
    L2.push(["📹","ライブカメラ",s.cam||`https://www.google.com/search?q=${q}+%E3%83%A9%E3%82%A4%E3%83%96%E3%82%AB%E3%83%A1%E3%83%A9`,!!s.cam]);
    L2.push(["🏄","ウェザーニュース",s.wn||"https://weathernews.jp/surf/",!!s.wn]);
    L2.push(["🌤","Yahoo天気",s.yahoo||`https://search.yahoo.co.jp/search?p=${q}+%E5%A4%A9%E6%B0%97`,!!s.yahoo]);
  }
  L2.push(["🗺","地図",`https://www.google.com/maps?q=${s.lat},${s.lon}`,false]);
  $("links").innerHTML=L2.map(([i,t,u,c])=>`<a href="${esc(u)}" target="_blank" rel="noopener" class="${c?'custom':''}"><i>${i}</i>${t}</a>`).join("");
  $("linkhint").textContent=s.temp?"保存すると潮見表やライブカメラも登録できます":(!s.tide||!s.cam?"「編集」でページを登録すると直接開けます":"");
}

/* ---------- data ---------- */
async function load(s){
  const k=`${s.lat},${s.lon}`;
  if(cache[k]&&Date.now()-cache[k].t<15*60e3) return cache[k].d;
  const base=`latitude=${s.lat}&longitude=${s.lon}&timezone=auto&forecast_days=3`;
  const [w,m]=await Promise.all([
    fetch(`https://api.open-meteo.com/v1/forecast?${base}&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m,wind_direction_10m,wind_gusts_10m&daily=sunrise,sunset&wind_speed_unit=ms`).then(r=>{if(!r.ok)throw 0;return r.json()}),
    fetch(`https://marine-api.open-meteo.com/v1/marine?${base}&hourly=wave_height,wave_direction,wave_period,swell_wave_direction,sea_level_height_msl,sea_surface_temperature`).then(r=>r.ok?r.json():null).catch(()=>null)
  ]);
  const n=w.hourly.time.length, empty=Array(n).fill(null);
  const mh=(m&&m.hourly)||{};
  ["wave_height","wave_direction","wave_period","swell_wave_direction","sea_level_height_msl","sea_surface_temperature"].forEach(x=>{if(!mh[x])mh[x]=empty;});
  mh.time=w.hourly.time;
  const d={w,m:{hourly:mh},off:w.utc_offset_seconds||0,hasWave:mh.wave_height.some(v=>v!=null)};
  cache[k]={t:Date.now(),d}; return d;
}
function nowIndex(times,off){
  const n=new Date(Date.now()+off*1000), p=x=>String(x).padStart(2,"0");
  const key=`${n.getUTCFullYear()}-${p(n.getUTCMonth()+1)}-${p(n.getUTCDate())}T${p(n.getUTCHours())}:00`;
  const i=times.indexOf(key); return i<0?0:i;
}

function dialSvg(face,windFrom,windSpd,waveFrom){
  const c=100,r=78;
  const pt=(deg,rad)=>{const a=(deg-90)*Math.PI/180;return [c+rad*Math.cos(a),c+rad*Math.sin(a)]};
  const ticks=DIRS.map(([n,d])=>{const [x,y]=pt(d,r+13);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${d%90?9:12}" fill="var(--sub)" font-weight="${d===0?700:400}">${n}</text>`}).join("");
  let halves=`<circle cx="${c}" cy="${c}" r="${r}" fill="var(--sea-soft)"/>`;
  if(face!=null){
    const [x1,y1]=pt(face-90,r),[x2,y2]=pt(face+90,r),[lx,ly]=pt(face,r*0.55),[gx,gy]=pt(face+180,r*0.55);
    halves=`<circle cx="${c}" cy="${c}" r="${r}" fill="var(--land)"/>
    <path d="M${x1},${y1} A${r},${r} 0 0 1 ${x2},${y2} Z" fill="var(--sea-soft)"/>
    <path d="M${x1},${y1} A${r},${r} 0 0 1 ${x2},${y2}" fill="none" stroke="var(--sea)" stroke-width="3"/>
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--sub)" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="${lx}" y="${ly}" text-anchor="middle" font-size="10" fill="var(--sea)">海</text><text x="${gx}" y="${gy}" text-anchor="middle" font-size="10" fill="var(--sub)">陸</text>`;
  }
  const [kc]=windKind(windFrom,face), col=`var(--${kc})`;
  const [wx0,wy0]=pt(windFrom,r-4),[wx1,wy1]=pt(windFrom+180,r-30);
  const a=(windFrom+180-90)*Math.PI/180+Math.PI, L=12;
  const ah=`${wx1},${wy1} ${wx1+L*Math.cos(a+0.45)},${wy1+L*Math.sin(a+0.45)} ${wx1+L*Math.cos(a-0.45)},${wy1+L*Math.sin(a-0.45)}`;
  const wave=waveFrom!=null?(()=>{const [vx,vy]=pt(waveFrom,r+1);return `<circle cx="${vx}" cy="${vy}" r="6" fill="var(--sea)" stroke="var(--panel)" stroke-width="2"><title>うねりの来る方向</title></circle>`})():"";
  return `<svg class="dial" viewBox="0 0 200 200" role="img" aria-label="風向き：${dirName(windFrom)}から ${windSpd.toFixed(1)}m/s">
    ${halves}${ticks}
    <line x1="${wx0}" y1="${wy0}" x2="${wx1}" y2="${wy1}" stroke="${col}" stroke-width="6" stroke-linecap="round"/>
    <polygon points="${ah}" fill="${col}"/>${wave}
    <text x="${c}" y="${c+4}" text-anchor="middle" font-family="var(--num)" font-size="30" font-weight="700" fill="var(--ink)">${windSpd.toFixed(1)}</text>
    <text x="${c}" y="${c+18}" text-anchor="middle" font-size="9" fill="var(--sub)">m/s</text></svg>`;
}

function renderHero(d,s){
  const W=d.w.hourly,M=d.m.hourly,i=nowIndex(W.time,d.off);
  const ws=W.wind_speed_10m[i],wd=W.wind_direction_10m[i],gu=W.wind_gusts_10m[i];
  const wh=M.wave_height[i],wp=M.wave_period[i],wvd=M.swell_wave_direction[i]??M.wave_direction[i];
  const [kc,kn]=windKind(wd,s.face), [ic,wn]=wx(W.weather_code[i]), sst=M.sea_surface_temperature[i];
  const sr=d.w.daily.sunrise[0].slice(11),ss=d.w.daily.sunset[0].slice(11);
  const verdict=s.face==null
    ?`<div class="verdict">${dirName(wd)}の風<small>最大 ${f0(gu)}m/s</small></div>
      <div class="facepick">海はどっちの方角？（選ぶとオフショア判定が出ます）<div>${DIRS.map(([n,dg])=>`<button data-f="${dg}">${n}</button>`).join("")}</div></div>`
    :`<div class="verdict" style="color:var(--${kc})">${kn}<small>${dirName(wd)}の風 ${f1(ws)}m/s（最大 ${f0(gu)}m/s）</small></div>`;
  const waves=d.hasWave
    ?`<div class="stat"><b>${f1(wh)}</b><span>m</span><em>${f0(wp)}</em><span>秒</span></div><div class="wx">${wvd!=null?dirName(wvd)+"からのうねり":""}</div>`
    :`<div class="wx">この地点は波のデータがありません。陸地や湾の奥の場合は、少し沖をタップしてみてください。</div>`;
  $("hero").innerHTML=dialSvg(s.face,wd,ws,d.hasWave?wvd:null)+`<div class="read">${verdict}${waves}
    <div class="wx"><strong>${ic} ${wn}　${f0(W.temperature_2m[i])}℃</strong>　雨 ${W.precipitation_probability[i]??"–"}%<br>${sst!=null?`水温 ${sst.toFixed(0)}℃　`:""}日の出 ${sr}　日の入 ${ss}</div></div>`;
  $("hero").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{temp.face=+b.dataset.f;renderAll(true);});
  if(s.temp&&tempMarker){
    tempMarker.setIcon(pinIcon("temp",`${d.hasWave?f1(wh)+"m ":""}${f0(ws)}m/s`));
    tempMarker.bindPopup(`<div class="pop">${ic} ${wn}<br>波 <b>${d.hasWave?f1(wh):"–"}</b>m ${d.hasWave?f0(wp)+"秒":""}<br>風 <b>${f1(ws)}</b>m/s ${dirName(wd)}<br><button class="go">詳しく見る</button></div>`).openPopup();
  }
}

function renderDays(d){
  const days=[...new Set(d.w.hourly.time.map(t=>t.slice(0,10)))], lab=["今日","明日","明後日"];
  $("days").innerHTML=days.map((t,i)=>{const [y,mo,da]=t.split("-");return `<button aria-pressed="${i===dayIdx}" data-i="${i}">${lab[i]||""} ${+mo}/${+da}</button>`}).join("");
  $("days").querySelectorAll("button").forEach(b=>b.onclick=()=>{dayIdx=+b.dataset.i;renderAll(true)});
  return days[dayIdx];
}

function renderTide(d,day){
  const M=d.m.hourly,T=M.time,S=M.sea_level_height_msl;
  const idx=T.map((t,i)=>t.startsWith(day)?i:-1).filter(i=>i>=0), v=idx.map(i=>S[i]);
  if(!v.length||v.some(x=>x==null)){$("tide").innerHTML=`<div class="note">この地点は潮位データがありません。潮見表で確認してください。</div>`;return;}
  const w=600,h=140,p=18,mn=Math.min(...v),mx=Math.max(...v),rg=(mx-mn)||1;
  const X=i=>p+i*(w-2*p)/23,Y=y=>p+(1-(y-mn)/rg)*(h-2*p-14);
  const line=v.map((y,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(y).toFixed(1)}`).join("");
  const ex=[];
  idx.forEach((gi,k)=>{const a=S[gi-1],b=S[gi],c=S[gi+1];if(a==null||c==null)return;if(b>a&&b>=c)ex.push(["満潮",k,b]);if(b<a&&b<=c)ex.push(["干潮",k,b]);});
  const nk=idx.indexOf(nowIndex(T,d.off));
  const hrs=[0,6,12,18].map(hh=>`<text x="${X(hh)}" y="${h-2}" font-size="11" fill="var(--sub)" text-anchor="middle">${hh}時</text>`).join("");
  $("tide").innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="潮位グラフ">
    <path d="${line} L${X(23)},${h-16} L${X(0)},${h-16} Z" fill="var(--sea-soft)"/>
    <path d="${line}" fill="none" stroke="var(--sea)" stroke-width="2.5"/>
    ${nk>=0?`<line x1="${X(nk)}" x2="${X(nk)}" y1="${p-6}" y2="${h-16}" stroke="var(--buoy)" stroke-width="2"/><text x="${X(nk)}" y="${p-8}" font-size="10" fill="var(--buoy)" text-anchor="middle">いま</text>`:""}
    ${ex.map(([n,k,y])=>`<circle cx="${X(k)}" cy="${Y(y)}" r="4" fill="var(--panel)" stroke="var(--sea)" stroke-width="2"/>`).join("")}${hrs}</svg>
    <div class="tides">${ex.length?ex.map(([n,k])=>`<span>${n} <b>${String(k).padStart(2,"0")}:00頃</b></span>`).join(""):"<span>この日は満潮・干潮の山がはっきりしません</span>"}</div>`;
}

function renderHourly(d,day,s){
  const W=d.w.hourly,M=d.m.hourly,T=W.time,nowI=nowIndex(T,d.off);
  const idx=T.map((t,i)=>t.startsWith(day)&&+t.slice(11,13)>=4&&+t.slice(11,13)<=20?i:-1).filter(i=>i>=0);
  const row=(label,f)=>`<tr><th>${label}</th>${idx.map(i=>`<td class="${i===nowI?'now':''}">${f(i)}</td>`).join("")}</tr>`;
  $("hourly").innerHTML=`<table>
    ${row("時刻",i=>`<b>${+T[i].slice(11,13)}時</b>`)}
    ${row("天気",i=>wx(W.weather_code[i])[0])}
    ${row("気温",i=>`${f0(W.temperature_2m[i])}°`)}
    ${row("雨",i=>`${W.precipitation_probability[i]??"–"}%`)}
    ${row("風",i=>{const [k]=windKind(W.wind_direction_10m[i],s.face);return `${arrowSvg(W.wind_direction_10m[i],k==="none"?"var(--ink)":`var(--${k})`)} <span class="n">${f0(W.wind_speed_10m[i])}</span>`})}
    ${s.face!=null?row("風向",i=>{const [k,n]=windKind(W.wind_direction_10m[i],s.face);return `<span class="k ${k}">${n.replace("ショア","")}</span>`}):""}
    ${d.hasWave?row("波高",i=>`<span class="n">${f1(M.wave_height[i])}</span>`)+row("周期",i=>`${f0(M.wave_period[i])}秒`):""}
  </table>`;
  const cur=$("hourly").querySelector("td.now");
  if(cur) $("hourly").scrollLeft=Math.max(0,cur.offsetLeft-90);
}

let reqId=0;
async function renderAll(skipFetch){
  renderSpots();
  const s=spot();
  if(!s){$("place").innerHTML="";$("hero").innerHTML=`<div class="msg"><b>スポットがありません</b>地図の海の上をタップするか、「＋ 追加」から登録してください。</div>`;$("links").innerHTML="";$("dataSec").hidden=true;return;}
  renderPlace(s); renderLinks(s);
  const my=++reqId;
  if(!skipFetch) $("hero").innerHTML=`<div class="msg">読み込み中…</div>`;
  try{
    const d=await load(s); if(my!==reqId)return;
    $("dataSec").hidden=false;
    renderHero(d,s);
    const day=renderDays(d); renderTide(d,day); renderHourly(d,day,s);
  }catch(e){
    if(my!==reqId)return;
    $("dataSec").hidden=true;
    $("hero").innerHTML=`<div class="msg"><b>予報データを取得できませんでした</b>電波の状態を確認して、少し待ってから再読み込みしてください。下のボタンから各サイトは開けます。</div>`;
  }
}

/* ---------- editor ---------- */
function openEditor(s,fromTemp){
  const isNew=!s||fromTemp;
  s=s||{id:"s"+Date.now(),name:"",lat:"",lon:"",face:180,tide:"",cam:"",wn:"",yahoo:""};
  const f=$("edform");
  f.innerHTML=`<h3>${isNew?"スポットを保存":"スポットを編集"}</h3>
    <label>名前<input name="name" required value="${esc(s.name)}" placeholder="例：古仁屋、鵠沼"></label>
    <div class="row2"><label>緯度<input name="lat" required inputmode="decimal" value="${esc(s.lat)}" placeholder="35.3175"></label>
    <label>経度<input name="lon" required inputmode="decimal" value="${esc(s.lon)}" placeholder="139.4710"></label></div>
    ${fromTemp?"":`<p class="hint">地図をタップして「この地点を保存」からでも登録できます。</p>`}
    <label>海はどっちの方角？<select name="face">${DIRS.map(([n,d])=>`<option value="${d}" ${+s.face===d?"selected":""}>${n}</option>`).join("")}</select></label>
    <p class="hint">浜に立って海を見たときの方角です。オフショア・オンショアの判定に使います。</p>
    <details ${isNew?"":"open"}><summary>よく見るページを登録（任意）</summary>
      <label>潮見表のURL<input name="tide" type="url" value="${esc(s.tide)}" placeholder="https://..."></label>
      <label>ライブカメラのURL<input name="cam" type="url" value="${esc(s.cam)}" placeholder="https://..."></label>
      <label>ウェザーニュースのURL<input name="wn" type="url" value="${esc(s.wn)}" placeholder="https://weathernews.jp/..."></label>
      <label>Yahoo天気のURL<input name="yahoo" type="url" value="${esc(s.yahoo)}" placeholder="https://weather.yahoo.co.jp/..."></label>
      <p class="hint">いつも見ているページを開き、アドレスをコピーして貼ってください。空欄なら検索結果が開きます。</p>
    </details>
    <div class="btns">
      ${!isNew?`<button type="button" class="btn danger" id="delBtn">削除</button>`:"<span></span>"}
      <span style="display:flex;gap:8px"><button type="button" class="btn" id="cancelBtn">キャンセル</button><button type="submit" class="btn primary">保存</button></span>
    </div>`;
  const latIn=f.elements.lat;
  latIn.addEventListener("input",()=>{const m=latIn.value.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);if(m){latIn.value=m[1];f.elements.lon.value=m[2];}});
  f.querySelector("#cancelBtn").onclick=()=>$("dlg").close();
  const del=f.querySelector("#delBtn");
  if(del) del.onclick=()=>{if(!confirm(`「${s.name}」を削除しますか？`))return;state.spots=state.spots.filter(x=>x.id!==s.id);state.cur=state.spots[0]?.id||(temp?"temp":null);save();$("dlg").close();drawSpots();renderAll();};
  f.onsubmit=e=>{
    e.preventDefault();
    const E=f.elements, lat=parseFloat(E.lat.value), lon=parseFloat(E.lon.value);
    if(!E.name.value.trim()||isNaN(lat)||isNaN(lon)){alert("名前・緯度・経度を入れてください");return;}
    const n={id:s.id,name:E.name.value.trim(),lat,lon,face:+E.face.value,tide:E.tide.value.trim(),cam:E.cam.value.trim(),wn:E.wn.value.trim(),yahoo:E.yahoo.value.trim()};
    if(isNew) state.spots.push(n); else state.spots=state.spots.map(x=>x.id===s.id?n:x);
    if(fromTemp){temp=null;}
    state.cur=n.id; save(); $("dlg").close(); dayIdx=0; drawTemp(); drawSpots(); renderAll();
  };
  $("dlg").showModal();
}

initMap(); drawSpots(); renderAll();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)renderAll(true)});
})();
</script>
</body>
