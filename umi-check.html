<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#BFE6EE">
<title>海チェック</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B3A55; --sub:#7D8CA6; --line:#E3ECF2; --card:#FFFFFF; --glass:rgba(255,255,255,.92);
  --aqua:#3FB8D4; --aqua-soft:#E3F6FA; --sand:#FFF1D6; --sand-line:#F2DDB0;
  --off:#2EBF94; --cross:#F5B731; --on:#FF7486; --none:#9AA9BF; --pin:#FF8A5B;
  --num:"Fredoka","Zen Maru Gothic",sans-serif;
  --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --shadow:0 10px 30px rgba(43,58,85,.16);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--jp);color:var(--ink);font-size:14px;line-height:1.5;background:#BFE6EE;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}

#map{position:fixed;inset:0;background:#BFE6EE}
.leaflet-container{font-family:var(--jp)}
.leaflet-control-attribution{font-size:10px;border-radius:8px 0 0 0}

/* top bar */
.topbar{position:fixed;z-index:700;top:calc(14px + env(safe-area-inset-top,0px));left:412px;right:16px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.topbar > *{pointer-events:auto}
.search{display:flex;gap:6px;max-width:440px}
.search input{flex:1;min-width:0;border:none;border-radius:999px;padding:10px 16px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.search button{flex:none;width:42px;border:none;border-radius:50%;background:var(--glass);box-shadow:var(--shadow);font-size:17px}
.results{max-width:440px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.results button{display:block;width:100%;text-align:left;border:none;background:none;padding:10px 16px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:none}
.results button:hover{background:var(--aqua-soft)}
.results small{color:var(--sub);margin-left:6px}
.spots{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.spots::-webkit-scrollbar{display:none}
.chip{flex:none;border:none;border-radius:999px;padding:7px 14px;background:var(--glass);box-shadow:0 4px 12px rgba(43,58,85,.12);font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.temp[aria-pressed="true"]{background:var(--pin)}
.chip.ghost{color:var(--aqua)}
.hint{position:fixed;z-index:600;bottom:22px;left:calc(50% + 198px);transform:translateX(-50%);background:var(--glass);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--sub);box-shadow:var(--shadow);white-space:nowrap;pointer-events:none}

/* panel */
.panel{position:fixed;z-index:650;top:calc(14px + env(safe-area-inset-top,0px));left:14px;bottom:14px;width:384px;background:var(--glass);backdrop-filter:blur(12px);border-radius:28px;box-shadow:var(--shadow);overflow-y:auto;overscroll-behavior:contain;padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.grab{display:none}
.ph{display:flex;align-items:center;gap:8px}
.ph h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.02em;line-height:1.2}
.ph small{display:block;color:var(--sub);font-family:var(--num);font-size:12px}
.ph .act{margin-left:auto;border:none;border-radius:999px;padding:6px 12px;background:var(--aqua-soft);color:var(--ink);font-weight:700;font-size:13px;white-space:nowrap}
.ph .act.save{background:var(--pin);color:#fff}

.top{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center}
.dial{width:128px;height:128px}
.verdict{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-weight:900;font-size:16px;color:#fff}
.verdict.off{background:var(--off)}.verdict.cross{background:var(--cross)}.verdict.on{background:var(--on)}.verdict.none{background:var(--none)}
.vsub{color:var(--sub);font-size:12px;margin-top:4px}
.facepick{margin-top:6px;font-size:12px;color:var(--sub)}
.facepick div{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:3px}
.facepick button{border:none;border-radius:8px;background:var(--aqua-soft);padding:3px 0;font-size:12px;font-weight:700}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border-radius:18px;padding:9px 10px 8px;box-shadow:0 2px 8px rgba(43,58,85,.06)}
.tile.wave{background:var(--aqua-soft)}.tile.sun{background:var(--sand)}
.tile .lb{font-size:11px;color:var(--sub);font-weight:700}
.tile .v{font-family:var(--num);font-weight:600;font-size:26px;line-height:1.1}
.tile .v small{font-size:12px;margin-left:2px;color:var(--sub);font-weight:500}
.tile .s{font-size:11px;color:var(--sub);line-height:1.3}

.days{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:3px}
.days button{flex:1;border:none;background:none;border-radius:999px;padding:5px 0;font-weight:700;font-size:13px;color:var(--sub)}
.days button[aria-pressed="true"]{background:var(--ink);color:#fff}

.card{background:var(--card);border-radius:20px;padding:10px 12px;box-shadow:0 2px 8px rgba(43,58,85,.06)}
.card h2{margin:0 0 4px;font-size:13px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline}
.card h2 span{font-size:11px;color:var(--sub);font-weight:500}
#tide svg{display:block;width:100%;height:auto}
.tides{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--sub)}
.tides b{font-family:var(--num);color:var(--ink);font-size:14px;font-weight:600}

.strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.h{flex:none;width:46px;border-radius:14px;padding:5px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.h.now{background:var(--aqua-soft)}
.h .t{font-size:11px;color:var(--sub);font-weight:700}
.h .e{font-size:17px;line-height:1.2}
.h .w{font-family:var(--num);font-weight:600;font-size:14px;display:flex;align-items:center;gap:1px}
.h .d{width:8px;height:8px;border-radius:50%}
.h .vv{font-family:var(--num);font-size:12px;color:var(--aqua);font-weight:600}
.arrow{width:13px;height:13px}
.legend{display:flex;gap:10px;font-size:11px;color:var(--sub);margin-top:2px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}

.links{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.links a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink);font-size:10px;font-weight:700;line-height:1.2;text-align:center}
.links a i{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--card);font-style:normal;font-size:19px;box-shadow:0 2px 8px rgba(43,58,85,.08)}
.links a.custom i{box-shadow:0 0 0 2px var(--aqua)}
.note{font-size:10px;color:var(--sub);margin:0;line-height:1.5}
.msg{background:var(--card);border-radius:18px;padding:14px;font-size:13px}
.msg b{display:block;margin-bottom:2px}
.loading{color:var(--sub);text-align:center;padding:30px 0}

/* pins */
.pin{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);white-space:nowrap;filter:drop-shadow(0 3px 5px rgba(43,58,85,.25))}
.pin b{background:#fff;color:var(--ink);font-size:12px;font-weight:900;padding:3px 9px;border-radius:999px;line-height:1.4;border:2.5px solid var(--none)}
.pin b em{font-style:normal;font-family:var(--num);font-weight:600;margin-left:5px}
.pin i{width:3px;height:9px;background:var(--none);border-radius:2px}
.pin.off b{border-color:var(--off)}.pin.off i{background:var(--off)}
.pin.cross b{border-color:var(--cross)}.pin.cross i{background:var(--cross)}
.pin.on b{border-color:var(--on)}.pin.on i{background:var(--on)}
.pin.temp b{background:var(--pin);border-color:var(--pin);color:#fff}.pin.temp i{background:var(--pin)}
.pin.sel b{transform:scale(1.12)}

/* editor */
dialog{border:none;border-radius:24px;padding:0;max-width:min(480px,94vw);width:100%;color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(43,58,85,.35)}
.ed{padding:20px}
.ed h3{margin:0 0 10px;font-size:18px;font-weight:900}
.ed label{display:block;font-size:12px;color:var(--sub);margin-top:10px;font-weight:700}
.ed input,.ed select{width:100%;margin-top:3px;padding:9px 12px;border:none;border-radius:12px;background:var(--aqua-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ed .hint2{font-size:11px;color:var(--sub);margin-top:4px}
.ed details{margin-top:12px}
.ed summary{cursor:pointer;font-weight:700}
.btns{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
.btn{border:none;background:var(--aqua-soft);border-radius:999px;padding:8px 16px;font-weight:700}
.btn.primary{background:var(--ink);color:#fff}
.btn.danger{background:none;color:var(--on)}

/* mobile */
@media (max-width:760px){
  .topbar{left:12px;right:12px}
  .search{max-width:none}
  .results{max-width:none}
  .hint{left:50%;bottom:auto;top:calc(118px + env(safe-area-inset-top,0px))}
  .leaflet-control-zoom{display:none}
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:62vh;border-radius:28px 28px 0 0;padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px))}
  .grab{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px;flex:none}
  .top{grid-template-columns:112px 1fr}
  .dial{width:112px;height:112px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="map" aria-label="地図"></div>

<div class="topbar">
  <form class="search" id="searchForm">
    <input id="q" type="search" placeholder="🔍 地名で探す（古仁屋、ワイキキ…）" autocomplete="off">
    <button type="button" id="locBtn" title="現在地へ" aria-label="現在地へ">📍</button>
  </form>
  <div class="results" id="results" hidden></div>
  <nav class="spots" id="spots" aria-label="保存したスポット"></nav>
</div>
<div class="hint" id="hint">海の上をタップするとその場所の予報が出ます</div>

<aside class="panel" id="panel">
  <div class="grab"></div>
  <header class="ph" id="ph"></header>
  <div id="body"></div>
</aside>

<dialog id="dlg"><form class="ed" id="edform" method="dialog"></form></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
const DIRS=[["北",0],["北東",45],["東",90],["南東",135],["南",180],["南西",225],["西",270],["北西",315]];
const DEFAULT=[{id:"s1",name:"鵠沼",lat:35.3175,lon:139.4710,face:180,tide:"",cam:"",wn:"",yahoo:""}];
const KEY="umi-check-v1";
let state={spots:DEFAULT,cur:"s1"};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.spots))state=s;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({spots:state.spots,cur:state.cur==="temp"?(state.spots[0]?.id||null):state.cur}))}catch(e){}};
let temp=null, dayIdx=0, cache={}, nowCache={};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const spot=()=>state.cur==="temp"&&temp?temp:(state.spots.find(s=>s.id===state.cur)||state.spots[0]||temp);
const dirName=d=>d==null?"—":["北","北北東","北東","東北東","東","東南東","南東","南南東","南","南南西","南西","西南西","西","西北西","北西","北北西"][Math.round(((d%360)+360)%360/22.5)%16];
function windKind(from,face){
  if(face==null||from==null) return ["none","風向き"];
  const diff=Math.abs(((from-face)%360+540)%360-180);
  if(diff<=50) return ["on","オンショア"];
  if(diff>=130) return ["off","オフショア"];
  return ["cross","サイド"];
}
const FACE={off:"😊",cross:"🙂",on:"😣",none:"💨"};
const WX={0:["☀️","快晴"],1:["🌤","晴れ"],2:["⛅","晴れ時々曇り"],3:["☁️","曇り"],45:["🌫","霧"],48:["🌫","霧"],51:["🌦","霧雨"],53:["🌦","霧雨"],55:["🌦","霧雨"],61:["🌧","小雨"],63:["🌧","雨"],65:["🌧","強い雨"],66:["🌧","雨"],67:["🌧","雨"],71:["🌨","小雪"],73:["🌨","雪"],75:["🌨","大雪"],77:["🌨","雪"],80:["🌦","にわか雨"],81:["🌧","にわか雨"],82:["⛈","激しい雨"],85:["🌨","にわか雪"],86:["🌨","にわか雪"],95:["⛈","雷雨"],96:["⛈","雷雨"],99:["⛈","雷雨"]};
const wx=c=>WX[c]||["・","—"];
const f1=v=>v==null?"–":v.toFixed(1), f0=v=>v==null?"–":v.toFixed(0);
const arrowSvg=(from,color)=>from==null?"":`<svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><g transform="rotate(${from+180} 8 8)"><path d="M8 1 L13 10 L9 8.5 L9 15 L7 15 L7 8.5 L3 10 Z" fill="${color}"/></g></svg>`;
const isMobile=()=>matchMedia("(max-width:760px)").matches;

/* ---------- map ---------- */
let map=null, tempMarker=null, spotLayer=null, base=null, detail=null;
function focus(lat,lon,zoom){
  if(!map) return;
  const z=zoom??Math.max(map.getZoom(),9);
  const p=map.project([lat,lon],z);
  if(isMobile()) p.y+= $("panel").offsetHeight/2 - 40; else p.x-=198;
  map.flyTo(map.unproject(p,z),z,{duration:.8});
}
function initMap(){
  if(!window.L){return;}
  map=L.map("map",{zoomControl:false,worldCopyJump:true,attributionControl:true}).setView([33,135],5);
  L.control.zoom({position:"bottomright"}).addTo(map);
  base=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}",{maxNativeZoom:10,maxZoom:18,attribution:"Tiles &copy; Esri, GEBCO, NOAA"});
  detail=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"});
  const pick=()=>{const z=map.getZoom();if(z>=11){if(map.hasLayer(base))map.removeLayer(base);if(!map.hasLayer(detail))detail.addTo(map);}else{if(map.hasLayer(detail))map.removeLayer(detail);if(!map.hasLayer(base))base.addTo(map);}};
  map.on("zoomend",pick); pick();
  let errs=0; base.on("tileerror",()=>{if(++errs>6){base=detail;pick();}});
  spotLayer=L.layerGroup().addTo(map);
  map.on("click",e=>{
    const ll=e.latlng.wrap();
    temp={id:"temp",temp:true,name:"選んだ地点",lat:+ll.lat.toFixed(4),lon:+ll.lng.toFixed(4),face:null};
    state.cur="temp"; dayIdx=0; $("results").hidden=true; $("hint").hidden=true;
    drawTemp(); drawSpots(); renderAll();
  });
  const s=spot(); if(s) setTimeout(()=>focus(s.lat,s.lon,9),50);
}
const pinIcon=(cls,label)=>L.divIcon({className:"",html:`<div class="pin ${cls}"><b>${label}</b><i></i></div>`,iconSize:[0,0]});
function drawTemp(){
  if(!map) return;
  if(tempMarker){map.removeLayer(tempMarker);tempMarker=null;}
  if(temp&&state.cur==="temp") tempMarker=L.marker([temp.lat,temp.lon],{icon:pinIcon("temp","📍 よみこみ中…"),zIndexOffset:1000}).addTo(map);
}
function drawSpots(){
  if(!map) return;
  spotLayer.clearLayers();
  for(const s of state.spots){
    const sel=s.id===state.cur?" sel":"";
    const m=L.marker([s.lat,s.lon],{icon:pinIcon(sel,esc(s.name))}).addTo(spotLayer);
    m.on("click",ev=>{L.DomEvent.stopPropagation(ev);state.cur=s.id;dayIdx=0;save();drawTemp();drawSpots();renderAll();focus(s.lat,s.lon);});
    loadNow(s).then(n=>{
      const [k]=windKind(n.wd,s.face);
      m.setIcon(pinIcon((k==="none"?"":k)+sel,`${esc(s.name)}<em>🌊${n.wh!=null?n.wh.toFixed(1):"–"} 💨${n.ws!=null?n.ws.toFixed(0):"–"}</em>`));
    }).catch(()=>{});
  }
}
async function loadNow(s){
  const k=`${s.lat},${s.lon}`;
  if(nowCache[k]&&Date.now()-nowCache[k].t<15*60e3) return nowCache[k].d;
  const [w,m]=await Promise.all([
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&current=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms`).then(r=>r.json()),
    fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${s.lat}&longitude=${s.lon}&current=wave_height`).then(r=>r.json()).catch(()=>({}))
  ]);
  const d={ws:w.current?.wind_speed_10m,wd:w.current?.wind_direction_10m,wh:m.current?.wave_height};
  nowCache[k]={t:Date.now(),d}; return d;
}

/* search */
let sTimer;
$("q").addEventListener("input",()=>{clearTimeout(sTimer);sTimer=setTimeout(search,350);});
$("searchForm").addEventListener("submit",e=>{e.preventDefault();search();});
async function search(){
  const q=$("q").value.trim(), box=$("results");
  if(q.length<2){box.hidden=true;return;}
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=ja`).then(r=>r.json());
    const list=r.results||[];
    box.innerHTML=list.length?list.map((p,i)=>`<button type="button" data-i="${i}">${esc(p.name)}<small>${esc([p.admin1,p.country].filter(Boolean).join("、"))}</small></button>`).join("")
      :`<button type="button" disabled>見つかりません。地図を動かして探してみてください</button>`;
    box.hidden=false;
    box.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const p=list[+b.dataset.i];focus(p.latitude,p.longitude,11);box.hidden=true;$("q").blur();});
  }catch(e){box.hidden=true;}
}
$("locBtn").onclick=()=>{
  if(!navigator.geolocation||!map) return;
  navigator.geolocation.getCurrentPosition(p=>focus(p.coords.latitude,p.coords.longitude,11),()=>alert("現在地を取得できませんでした。位置情報の許可を確認してください。"));
};

/* ---------- top bar ---------- */
function renderSpots(){
  $("spots").innerHTML=(temp?`<button class="chip temp" aria-pressed="${state.cur==="temp"}" data-id="temp">📍 選んだ地点</button>`:"")
    +state.spots.map(s=>`<button class="chip" aria-pressed="${s.id===state.cur}" data-id="${esc(s.id)}">${esc(s.name)}</button>`).join("")
    +`<button class="chip ghost" id="addBtn">＋ 追加</button>`;
  $("spots").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{
    state.cur=b.dataset.id;save();dayIdx=0;drawTemp();drawSpots();
    const s=spot(); if(s) focus(s.lat,s.lon);
    renderAll();
  });
  $("addBtn").onclick=()=>openEditor(null);
}

/* ---------- data ---------- */
async function load(s){
  const k=`${s.lat},${s.lon}`;
  if(cache[k]&&Date.now()-cache[k].t<15*60e3) return cache[k].d;
  const b=`latitude=${s.lat}&longitude=${s.lon}&timezone=auto&forecast_days=3`;
  const [w,m]=await Promise.all([
    fetch(`https://api.open-meteo.com/v1/forecast?${b}&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m,wind_direction_10m,wind_gusts_10m&daily=sunrise,sunset&wind_speed_unit=ms`).then(r=>{if(!r.ok)throw 0;return r.json()}),
    fetch(`https://marine-api.open-meteo.com/v1/marine?${b}&hourly=wave_height,wave_direction,wave_period,swell_wave_direction,sea_level_height_msl,sea_surface_temperature`).then(r=>r.ok?r.json():null).catch(()=>null)
  ]);
  const n=w.hourly.time.length, empty=Array(n).fill(null), mh=(m&&m.hourly)||{};
  ["wave_height","wave_direction","wave_period","swell_wave_direction","sea_level_height_msl","sea_surface_temperature"].forEach(x=>{if(!mh[x])mh[x]=empty;});
  mh.time=w.hourly.time;
  const d={w,m:{hourly:mh},off:w.utc_offset_seconds||0,hasWave:mh.wave_height.some(v=>v!=null)};
  cache[k]={t:Date.now(),d}; return d;
}
function nowIndex(times,off){
  const n=new Date(Date.now()+off*1000), p=x=>String(x).padStart(2,"0");
  const i=times.indexOf(`${n.getUTCFullYear()}-${p(n.getUTCMonth()+1)}-${p(n.getUTCDate())}T${p(n.getUTCHours())}:00`);
  return i<0?0:i;
}

function dialSvg(face,windFrom,windSpd,waveFrom){
  const c=100,r=80, pt=(deg,rad)=>{const a=(deg-90)*Math.PI/180;return [c+rad*Math.cos(a),c+rad*Math.sin(a)]};
  let bg=`<circle cx="${c}" cy="${c}" r="${r}" fill="#E3F6FA"/>`;
  if(face!=null){
    const [x1,y1]=pt(face-90,r),[x2,y2]=pt(face+90,r),[lx,ly]=pt(face,r*0.62),[gx,gy]=pt(face+180,r*0.62);
    bg=`<circle cx="${c}" cy="${c}" r="${r}" fill="#FFF1D6"/><path d="M${x1},${y1} A${r},${r} 0 0 1 ${x2},${y2} Z" fill="#CDEFF6"/>
    <text x="${lx}" y="${ly+5}" text-anchor="middle" font-size="15">🌊</text><text x="${gx}" y="${gy+5}" text-anchor="middle" font-size="15">🏝</text>`;
  }
  const ticks=[["北",0],["東",90],["南",180],["西",270]].map(([n,d])=>{const [x,y]=pt(d,r+13);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="900" fill="#7D8CA6">${n}</text>`}).join("");
  const [kc]=windKind(windFrom,face), col=getComputedStyle(document.documentElement).getPropertyValue(`--${kc}`).trim();
  const [a0,b0]=pt(windFrom,r-6),[a1,b1]=pt(windFrom+180,r-34);
  const ang=(windFrom+90)*Math.PI/180+Math.PI, L=16;
  const head=`${a1},${b1} ${a1+L*Math.cos(ang+0.5)},${b1+L*Math.sin(ang+0.5)} ${a1+L*Math.cos(ang-0.5)},${b1+L*Math.sin(ang-0.5)}`;
  const wave=waveFrom!=null?(()=>{const [vx,vy]=pt(waveFrom,r);return `<circle cx="${vx}" cy="${vy}" r="8" fill="#3FB8D4" stroke="#fff" stroke-width="3"><title>うねりの来る方向</title></circle>`})():"";
  return `<svg class="dial" viewBox="-14 -14 228 228" role="img" aria-label="風：${dirName(windFrom)}から ${f1(windSpd)}m/s">${bg}
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#fff" stroke-width="5"/>${ticks}
    <line x1="${a0}" y1="${b0}" x2="${a1}" y2="${b1}" stroke="${col}" stroke-width="9" stroke-linecap="round"/><polygon points="${head}" fill="${col}" stroke="${col}" stroke-width="3" stroke-linejoin="round"/>${wave}
    <circle cx="${c}" cy="${c}" r="27" fill="#fff"/>
    <text x="${c}" y="${c+6}" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="25" font-weight="600" fill="#2B3A55">${f1(windSpd)}</text>
    <text x="${c}" y="${c+19}" text-anchor="middle" font-size="9" fill="#7D8CA6">m/s</text></svg>`;
}

function renderHeader(s){
  $("ph").innerHTML=`<div><h1>${esc(s.name)}</h1><small>${s.lat}, ${s.lon}</small></div>`+
    (s.temp?`<button class="act save" id="pact">⭐ 保存</button>`:`<button class="act" id="pact">✏️ 編集</button>`);
  $("pact").onclick=()=>s.temp?openEditor({...temp,id:"s"+Date.now(),name:"",face:temp.face??180,tide:"",cam:"",wn:"",yahoo:""},true):openEditor(s);
}
function linksHtml(s){
  const q=encodeURIComponent(s.name);
  const L2=[["🌬","Windy",`https://www.windy.com/?waves,${s.lat},${s.lon},11`,false]];
  if(!s.temp){
    L2.push(["🌊","潮見表",s.tide||`https://www.google.com/search?q=${q}+%E6%BD%AE%E8%A6%8B%E8%A1%A8`,!!s.tide]);
    L2.push(["📹","カメラ",s.cam||`https://www.google.com/search?q=${q}+%E3%83%A9%E3%82%A4%E3%83%96%E3%82%AB%E3%83%A1%E3%83%A9`,!!s.cam]);
    L2.push(["🏄","ウェザーニュース",s.wn||"https://weathernews.jp/surf/",!!s.wn]);
    L2.push(["🌤","Yahoo",s.yahoo||`https://search.yahoo.co.jp/search?p=${q}+%E5%A4%A9%E6%B0%97`,!!s.yahoo]);
  }
  L2.push(["🗺","地図",`https://www.google.com/maps?q=${s.lat},${s.lon}`,false]);
  return `<div class="links">${L2.map(([i,t,u,c])=>`<a href="${esc(u)}" target="_blank" rel="noopener" class="${c?'custom':''}"><i>${i}</i>${t}</a>`).join("")}</div>`;
}

function tideHtml(d,day){
  const M=d.m.hourly,T=M.time,S=M.sea_level_height_msl;
  const idx=T.map((t,i)=>t.startsWith(day)?i:-1).filter(i=>i>=0), v=idx.map(i=>S[i]);
  if(!v.length||v.some(x=>x==null)) return `<div class="tides">この地点は潮位データがありません。潮見表で確認してください。</div>`;
  const w=340,h=74,p=8,mn=Math.min(...v),mx=Math.max(...v),rg=(mx-mn)||1;
  const X=i=>p+i*(w-2*p)/23,Y=y=>6+(1-(y-mn)/rg)*(h-26);
  const line=v.map((y,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(y).toFixed(1)}`).join("");
  const ex=[];
  idx.forEach((gi,k)=>{const a=S[gi-1],b=S[gi],c=S[gi+1];if(a==null||c==null)return;if(b>a&&b>=c)ex.push(["満潮",k,b]);if(b<a&&b<=c)ex.push(["干潮",k,b]);});
  const nk=idx.indexOf(nowIndex(T,d.off));
  const hrs=[0,6,12,18].map(hh=>`<text x="${X(hh)}" y="${h-1}" font-size="9" fill="#7D8CA6" text-anchor="middle">${hh}時</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="潮位グラフ">
    <path d="${line} L${X(23)},${h-14} L${X(0)},${h-14} Z" fill="#E3F6FA"/><path d="${line}" fill="none" stroke="#3FB8D4" stroke-width="2.5" stroke-linecap="round"/>
    ${nk>=0?`<line x1="${X(nk)}" x2="${X(nk)}" y1="2" y2="${h-14}" stroke="#FF8A5B" stroke-width="2" stroke-dasharray="3 3"/>`:""}
    ${ex.map(([n,k,y])=>`<circle cx="${X(k)}" cy="${Y(y)}" r="4" fill="#fff" stroke="#3FB8D4" stroke-width="2.5"/>`).join("")}${hrs}</svg>
    <div class="tides">${ex.length?ex.map(([n,k])=>`<span>${n==="満潮"?"⬆️":"⬇️"} ${n} <b>${k}:00</b></span>`).join(""):"<span>はっきりした満潮・干潮がない日です</span>"}</div>`;
}

function hourlyHtml(d,day,s){
  const W=d.w.hourly,M=d.m.hourly,T=W.time,nowI=nowIndex(T,d.off);
  const idx=T.map((t,i)=>t.startsWith(day)&&+t.slice(11,13)>=4&&+t.slice(11,13)<=20?i:-1).filter(i=>i>=0);
  const css=getComputedStyle(document.documentElement);
  return `<div class="strip" id="strip">${idx.map(i=>{
    const [k]=windKind(W.wind_direction_10m[i],s.face), col=css.getPropertyValue(`--${k==="none"?"ink":k}`).trim();
    return `<div class="h ${i===nowI?"now":""}"><span class="t">${+T[i].slice(11,13)}時</span><span class="e">${wx(W.weather_code[i])[0]}</span>
      <span class="w">${arrowSvg(W.wind_direction_10m[i],col)}${f0(W.wind_speed_10m[i])}</span>
      ${d.hasWave?`<span class="vv">${f1(M.wave_height[i])}m</span>`:""}</div>`}).join("")}</div>
    ${s.face!=null?`<div class="legend"><span><i style="background:var(--off)"></i>オフ</span><span><i style="background:var(--cross)"></i>サイド</span><span><i style="background:var(--on)"></i>オン</span><span style="margin-left:auto">風 m/s・波 m</span></div>`:""}`;
}

let reqId=0;
async function renderAll(quiet){
  renderSpots();
  const s=spot();
  if(!s){$("ph").innerHTML="";$("body").innerHTML=`<div class="msg"><b>🏝 スポットがまだありません</b>地図の海の上をタップするか、「＋ 追加」から登録してください。</div>`;return;}
  renderHeader(s);
  const my=++reqId;
  if(!quiet) $("body").innerHTML=`<div class="loading">🌊 よみこみ中…</div>`;
  try{
    const d=await load(s); if(my!==reqId)return;
    const W=d.w.hourly,M=d.m.hourly,i=nowIndex(W.time,d.off);
    const ws=W.wind_speed_10m[i],wd=W.wind_direction_10m[i],gu=W.wind_gusts_10m[i];
    const wh=M.wave_height[i],wp=M.wave_period[i],wvd=M.swell_wave_direction[i]??M.wave_direction[i];
    const [kc,kn]=windKind(wd,s.face), [ic,wn]=wx(W.weather_code[i]), sst=M.sea_surface_temperature[i];
    const days=[...new Set(W.time.map(t=>t.slice(0,10)))], lab=["今日","明日","明後日"], day=days[dayIdx];
    const sr=d.w.daily.sunrise[dayIdx]?.slice(11)||"",ss=d.w.daily.sunset[dayIdx]?.slice(11)||"";
    $("body").innerHTML=`
      <div class="top">${dialSvg(s.face,wd,ws,d.hasWave?wvd:null)}
        <div><span class="verdict ${kc}">${FACE[kc]} ${kn}</span>
          <div class="vsub">${dirName(wd)}の風 ${f1(ws)}m/s・最大${f0(gu)}m/s${d.hasWave&&wvd!=null?`<br>うねりは${dirName(wvd)}から`:""}</div>
          ${s.face==null?`<div class="facepick">海はどっち？<div>${DIRS.map(([n,dg])=>`<button data-f="${dg}">${n}</button>`).join("")}</div></div>`:""}
        </div></div>
      <div class="tiles">
        <div class="tile wave"><div class="lb">🌊 波</div><div class="v">${d.hasWave?f1(wh):"–"}<small>m</small></div><div class="s">${d.hasWave?`周期 ${f0(wp)}秒`:"データなし"}</div></div>
        <div class="tile sun"><div class="lb">${ic} ${wn}</div><div class="v">${f0(W.temperature_2m[i])}<small>℃</small></div><div class="s">雨 ${W.precipitation_probability[i]??"–"}%</div></div>
        <div class="tile"><div class="lb">🐠 水温</div><div class="v">${sst!=null?sst.toFixed(0):"–"}<small>℃</small></div><div class="s">🌅${sr} 🌇${ss}</div></div>
      </div>
      ${d.hasWave?"":`<div class="msg">この地点は波のデータがありません。陸地や湾の奥なら、少し沖をタップしてみてください。</div>`}
      <div class="days">${days.map((t,j)=>{const [,mo,da]=t.split("-");return `<button aria-pressed="${j===dayIdx}" data-d="${j}">${lab[j]||""} ${+mo}/${+da}</button>`}).join("")}</div>
      <div class="card"><h2>潮の満ち引き <span>予測モデル・目安</span></h2>${tideHtml(d,day)}</div>
      <div class="card"><h2>時間ごと</h2>${hourlyHtml(d,day,s)}</div>
      ${linksHtml(s)}
      <p class="note">データ：Open-Meteo　地図：Esri, OpenStreetMap　潮位は目安なので、正確な時刻は潮見表で確認してください。</p>`;
    $("body").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{temp.face=+b.dataset.f;renderAll(true);});
    $("body").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{dayIdx=+b.dataset.d;renderAll(true);});
    const now=$("strip").querySelector(".now"); if(now) $("strip").scrollLeft=Math.max(0,now.offsetLeft-60);
    if(s.temp&&tempMarker){
      const [k]=windKind(wd,s.face);
      tempMarker.setIcon(pinIcon("temp",`📍<em>🌊${d.hasWave?f1(wh):"–"} 💨${f0(ws)}</em>`));
    }
  }catch(e){
    if(my!==reqId)return;
    $("body").innerHTML=`<div class="msg"><b>予報データを取得できませんでした</b>電波の状態を確認して、少し待ってから再読み込みしてください。</div>${linksHtml(s)}`;
  }
}

/* ---------- editor ---------- */
function openEditor(s,fromTemp){
  const isNew=!s||fromTemp;
  s=s||{id:"s"+Date.now(),name:"",lat:"",lon:"",face:180,tide:"",cam:"",wn:"",yahoo:""};
  const f=$("edform");
  f.innerHTML=`<h3>${isNew?"⭐ スポットを保存":"✏️ スポットを編集"}</h3>
    <label>名前<input name="name" required value="${esc(s.name)}" placeholder="例：古仁屋、鵠沼"></label>
    <div class="row2"><label>緯度<input name="lat" required inputmode="decimal" value="${esc(s.lat)}" placeholder="35.3175"></label>
    <label>経度<input name="lon" required inputmode="decimal" value="${esc(s.lon)}" placeholder="139.4710"></label></div>
    ${fromTemp?"":`<p class="hint2">地図で海をタップして「保存」からでも登録できます。</p>`}
    <label>海はどっちの方角？<select name="face">${DIRS.map(([n,d])=>`<option value="${d}" ${+s.face===d?"selected":""}>${n}</option>`).join("")}</select></label>
    <p class="hint2">浜に立って海を見たときの方角です。オフショア判定に使います。</p>
    <details ${isNew?"":"open"}><summary>よく見るページを登録（任意）</summary>
      <label>潮見表のURL<input name="tide" type="url" value="${esc(s.tide)}" placeholder="https://..."></label>
      <label>ライブカメラのURL<input name="cam" type="url" value="${esc(s.cam)}" placeholder="https://..."></label>
      <label>ウェザーニュースのURL<input name="wn" type="url" value="${esc(s.wn)}" placeholder="https://weathernews.jp/..."></label>
      <label>Yahoo天気のURL<input name="yahoo" type="url" value="${esc(s.yahoo)}" placeholder="https://weather.yahoo.co.jp/..."></label>
      <p class="hint2">いつも見ているページのアドレスをコピーして貼ってください。空欄なら検索結果が開きます。</p>
    </details>
    <div class="btns">${!isNew?`<button type="button" class="btn danger" id="delBtn">削除</button>`:"<span></span>"}
      <span style="display:flex;gap:8px"><button type="button" class="btn" id="cancelBtn">やめる</button><button type="submit" class="btn primary">保存</button></span></div>`;
  const latIn=f.elements.lat;
  latIn.addEventListener("input",()=>{const m=latIn.value.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);if(m){latIn.value=m[1];f.elements.lon.value=m[2];}});
  f.querySelector("#cancelBtn").onclick=()=>$("dlg").close();
  const del=f.querySelector("#delBtn");
  if(del) del.onclick=()=>{if(!confirm(`「${s.name}」を削除しますか？`))return;state.spots=state.spots.filter(x=>x.id!==s.id);state.cur=state.spots[0]?.id||(temp?"temp":null);save();$("dlg").close();drawSpots();renderAll();};
  f.onsubmit=e=>{
    e.preventDefault();
    const E=f.elements, lat=parseFloat(E.lat.value), lon=parseFloat(E.lon.value);
    if(!E.name.value.trim()||isNaN(lat)||isNaN(lon)){alert("名前・緯度・経度を入れてください");return;}
    const n={id:s.id,name:E.name.value.trim(),lat,lon,face:+E.face.value,tide:E.tide.value.trim(),cam:E.cam.value.trim(),wn:E.wn.value.trim(),yahoo:E.yahoo.value.trim()};
    if(isNew) state.spots.push(n); else state.spots=state.spots.map(x=>x.id===s.id?n:x);
    if(fromTemp) temp=null;
    state.cur=n.id; save(); $("dlg").close(); dayIdx=0; drawTemp(); drawSpots(); renderAll();
  };
  $("dlg").showModal();
}

initMap(); drawSpots(); renderAll();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)renderAll(true)});
})();
</script>
</body>
</html>
